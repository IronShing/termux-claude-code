name: Build resolv-redirect shim

# Builds shim/resolv-redirect.c against aarch64 musl and uploads the .so
# as a release asset whenever a release is published. Also runs on push/PR
# to verify the source still compiles.

on:
  push:
    branches: [main]
    paths:
      - 'shim/**'
      - '.github/workflows/build-shim.yml'
  pull_request:
    paths:
      - 'shim/**'
      - '.github/workflows/build-shim.yml'
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig (bundles aarch64-musl cross-compiler)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Compile shim for aarch64-musl
        run: |
          set -eux
          mkdir -p dist
          # Zig bundles a complete aarch64-linux-musl sysroot — no external
          # cross-toolchain to download. -fno-stack-check avoids a Zig-specific
          # __zig_probe_stack reference that musl's runtime won't have.
          zig cc \
            -target aarch64-linux-musl \
            -shared -fPIC -O2 -Wall -Wextra \
            -fvisibility=default \
            -fno-stack-check \
            -o dist/libtcc-resolv-redirect.so \
            shim/resolv-redirect.c
          file dist/libtcc-resolv-redirect.so
          # Confirm aarch64 + dynamic + no glibc references.
          file dist/libtcc-resolv-redirect.so | grep -q 'aarch64' || (echo "Wrong arch"; exit 1)
          sha256sum dist/libtcc-resolv-redirect.so | tee dist/libtcc-resolv-redirect.so.sha256

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: libtcc-resolv-redirect-aarch64-musl
          path: dist/

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/libtcc-resolv-redirect.so \
            dist/libtcc-resolv-redirect.so.sha256 \
            --clobber
